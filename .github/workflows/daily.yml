name: 每日重建静态站（S2 管线 + Pages 部署）

on:
  schedule:
    - cron: "0 2 * * *"      # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:          # 允许手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write             # 允许推送到 gh-pages 分支（用仓库自带 GITHUB_TOKEN，无需配置密钥）

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_build.txt

      - name: 安装依赖
        run: pip install -r requirements_build.txt

      - name: 运行 S2 管线并构建静态站（dist/）
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_USE_HEAD: "NO"
          GDAL_HTTP_TIMEOUT: "120"
          GDAL_HTTP_LOW_SPEED_LIMIT: "10000"
          GDAL_HTTP_LOW_SPEED_TIME: "30"
        run: python3 build_static.py

      - name: 确保 dist/ 可被完整部署（覆盖仓库级 .gitignore 的 /* 白名单）
        run: |
          # 仓库 .gitignore 用 /* 白名单策略（防止 17GB 卫星数据入库），
          # 但 dist/ 是纯静态输出，需要全部文件都部署。
          # peaceiris/actions-gh-pages 在 publish_dir 内执行 git add --all，
          # 会继承上层 .gitignore → 99% 瓦片被忽略。
          # 解决：在 dist/ 内写一个允许全部文件的 .gitignore
          echo "# 静态站输出：全部文件都需要部署" > dist/.gitignore

      - name: 部署 dist/ 到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "每日数据更新：${{ github.run_number }}（$(date -u +%Y-%m-%d)）"

      - name: 预警推送（飞书机器人）
        # 构建后若任一组合 status=预警，则推送飞书。未配置 FEISHU_WEBHOOK 时自动跳过。
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          WH="$FEISHU_WEBHOOK"
          if [ -z "$WH" ]; then echo "未配置 FEISHU_WEBHOOK，跳过预警推送"; exit 0; fi
          ALERT=$(jq -r '[to_entries[] | select(.value.status=="预警")] | length' dist/outputs/manifest.json)
          if [ "$ALERT" = "0" ] || [ -z "$ALERT" ]; then echo "无预警组合，跳过推送"; exit 0; fi
          TEXT=$(jq -r '["【黄埭镇蓝藻监测 · 预警】"] + ([to_entries[] | select(.value.status=="预警")] | sort_by(.value.scene_date) | map("· \(.key)：水体 \(.value.water_ha)ha / 藻华 \(.value.bloom_ha)ha / ML藻华 \(.value.bloom_ml_ha)ha（\(.value.scene_date)，云量\(.value.cloud // 0)%）")) + ["站点：https://liening1.github.io/huangdi-algae-monitor/"] | join("\n")' dist/outputs/manifest.json)
          PAYLOAD=$(jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
          echo "推送预警（$ALERT 个组合）..."
          curl -fsS -X POST "$WH" -H "Content-Type: application/json" -d "$PAYLOAD"
