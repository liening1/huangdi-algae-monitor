name: 每日重建静态站（S2 管线 + Pages 部署）

on:
  schedule:
    - cron: "0 2 * * *"      # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:          # 允许手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write             # 允许推送到 gh-pages 分支（用仓库自带 GITHUB_TOKEN，无需配置密钥）

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_build.txt

      - name: 安装依赖
        run: pip install -r requirements_build.txt

      - name: 运行 S2 管线并构建静态站（dist/）
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_USE_HEAD: "NO"
          GDAL_HTTP_TIMEOUT: "120"
          GDAL_HTTP_LOW_SPEED_LIMIT: "10000"
          GDAL_HTTP_LOW_SPEED_TIME: "30"
        run: python3 build_static.py

      - name: 部署 dist/ 到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "每日数据更新：${{ github.run_number }}（$(date -u +%Y-%m-%d)）"
